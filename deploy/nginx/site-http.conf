# __DOMAIN__ — HTTP only. Used until a certificate exists (or with SKIP_TLS=1).
# Generated from deploy/nginx/site-http.conf by deploy/install.sh.

limit_req_zone $binary_remote_addr zone=__SERVICE___chat:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=__SERVICE___api:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root __WEBROOT__;
        default_type text/plain;
    }

    include __SNIPPET__;
}
