# __DOMAIN__ — HTTPS with a Let's Encrypt certificate (certbot webroot; renewals reload nginx).
# Generated from deploy/nginx/site-https.conf by deploy/install.sh.

limit_req_zone $binary_remote_addr zone=__SERVICE___chat:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=__SERVICE___api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=__SERVICE___events:10m rate=300r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root __WEBROOT__;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include __SNIPPET__;
}
