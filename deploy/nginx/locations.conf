# Proxy rules for __DOMAIN__ → 127.0.0.1:__PORT__. Included inside the site's server block.
# Generated from deploy/nginx/locations.conf by deploy/install.sh — edit the template, then re-run the installer.

client_max_body_size 1m;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Snapshot refresh is driven from localhost by the systemd timer; never expose it.
location = /api/refresh {
    return 404;
}

# Chat streams NDJSON and spends Anthropic credits: no buffering, long timeout, tight per-IP rate limit.
location = /api/chat {
    limit_req zone=__SERVICE___chat burst=5 nodelay;
    limit_req_status 429;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_pass http://127.0.0.1:__PORT__;
}

# Analytics beacons: tiny and frequent (page views + a 30 s heartbeat). Generous per-IP limit — a school network
# puts a whole classroom behind one address.
location = /api/e {
    limit_req zone=__SERVICE___events burst=60 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:__PORT__;
}

# JSON APIs (simulation is CPU-heavy).
location /api/ {
    limit_req zone=__SERVICE___api burst=10 nodelay;
    limit_req_status 429;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:__PORT__;
}

location / {
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:__PORT__;
}
